services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:?Set the Splunk HEC URL in .env}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:?Set the Splunk HEC token in .env}
      SPLUNK_HEC_INDEX: ${SPLUNK_HEC_INDEX:?Set the Splunk HEC index in .env}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      OTEL_SERVICE_NAME: phishing-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}
      SPLUNK_HEC_INDEX: ${SPLUNK_HEC_INDEX}
      PHISHING_EXPORT_STATE_DB: /app/state/phishing_export_state.sqlite3
    volumes:
      - phishing-state:/app/state
    expose:
      - "8000"
    depends_on:
      - otel-collector
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./phishing-ui
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

volumes:
  phishing-state:
